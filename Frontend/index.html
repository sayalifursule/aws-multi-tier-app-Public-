<!DOCTYPE html>
<html>
<head>
    <title>Frontend Server</title>
</head>

<body>
    <h1>Frontend Server Running on AWS</h1>

    <button onclick="fetchData()">Get Backend Data</button>

    <p id="demo">Click button to fetch backend response</p>

    <script>
        function fetchData() {
            fetch("/api")
            .then(response => response.text())
            .then(data => {
                document.getElementById("demo").innerHTML = data;
            })
            .catch(error => {
                document.getElementById("demo").innerHTML = "Error: " + error;
            });
        }
    </script>
</body>
</html>
